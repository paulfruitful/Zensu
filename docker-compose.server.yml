services:
  zensu-server:
    build:
      context: .
      dockerfile: Dockerfile.server
    container_name: zensu-server
    restart: unless-stopped
    network_mode: "host"
    environment:
      - ENABLE_VNC=true
      # Routes Chrome and API requests through Cloudflare WARP SOCKS5 proxy:
      - PROXY_URL=socks5://127.0.0.1:40000
      # Set a password for VNC if desired:
      # - VNC_PASSWORD=my_secure_vnc_password
    volumes:
      - ./data:/root/.config/zensu
      - ./downloads:/root/Downloads
    # Allocate shared memory so Chrome never crashes on heavy tabs
    shm_size: "2gb"
